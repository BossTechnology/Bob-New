name: CI

on:
  push:
    branches: [main]
  pull_request:

# The token can read this repository and nothing else.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The BOb-engine commit whose schema `bob` and fixture the live tests read.
  # Bump it by hand when the contract moves. BOb-engine main with #59 merged
  # (bob.claim_viewer_seat, «Alta sola, como viewer»).
  BOB_ENGINE_REF: 0a5f25a019698656ec07fd928578fcd1bfb57ac0
  # Same CLI version as BOb-engine's own CI.
  SUPABASE_CLI_VERSION: 2.120.0

jobs:
  static:
    name: Lint, typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          # Exact: the SBOM below records npm's version, which comes with it.
          node-version: '22.21.1'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # V14.2.5: the dependency inventory of this commit, kept with the run.
      # The same lockfile gives the same file (scripts/ci/sbom.mjs); the Node
      # version, and with it npm's, is pinned for this job.
      - run: node scripts/ci/sbom.mjs > sbom.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: sbom.cdx.json

  box-headers:
    name: Box headers on the built app
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --experimental-strip-types scripts/ci/check-box-headers.mjs

  live:
    name: Schema bob as bob_app (live tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: BossTechnology/BOb-engine
          ref: ${{ env.BOB_ENGINE_REF }}
          path: engine
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: engine/package.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm
      - uses: supabase/setup-cli@afb1b15109756ea5cf9d8985a359d9095235ca2b # v2.1.2
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - run: npm ci
      - name: Install BOb-engine's test helpers
        working-directory: engine
        run: pnpm install --frozen-lockfile
      - name: Start BOb-engine's stack and apply its migrations
        working-directory: engine
        run: |
          supabase start
          supabase db reset --no-seed
      - name: Load the two-tenant fixture and run the reference feeder
        env:
          BOB_ENGINE_DIR: engine
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: node scripts/ci/load-bob-world.mjs
      - name: All tests, live ones included (a missing database fails)
        env:
          BOB_REQUIRE_LIVE: '1'
          # The pinned engine has Slice 3: the rollup path must run, not skip.
          BOB_REQUIRE_SLICE3: '1'
          BOB_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: npm test
